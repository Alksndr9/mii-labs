<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Концепция 2 — Яркий</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:"Arial Rounded MT Bold",-apple-system,Arial,sans-serif;background:#fff7ed;color:#1e1b4b}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 48px;background:#7c3aed;color:#fff}
.logo{font-size:22px;font-weight:800}.cart{background:#facc15;color:#1e1b4b;border-radius:999px;padding:10px 20px;font-weight:700}
.hero{margin:32px 48px;border-radius:32px;background:linear-gradient(120deg,#f97316,#ec4899);color:#fff;padding:48px;display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:46px;line-height:1.1}.hero p{font-size:20px;margin-top:12px;opacity:.9}.hero .cta{display:inline-block;margin-top:24px;background:#fff;color:#ec4899;border-radius:999px;padding:16px 32px;font-weight:800;font-size:18px}
.big{font-size:140px}
.tabs{display:flex;gap:12px;margin:0 48px}.tab{padding:12px 24px;border-radius:16px;background:#fff;font-weight:700;box-shadow:0 4px 0 #fed7aa}.tab.on{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}
.scroll{display:flex;gap:24px;padding:28px 48px}
.card{min-width:300px;border-radius:28px;padding:24px;color:#fff;position:relative}
.card .e{font-size:64px}.card h3{font-size:26px;margin-top:8px}.card p{opacity:.9;margin-top:4px}
.card .p{font-size:28px;font-weight:800;margin-top:18px}.card .add{position:absolute;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#fff;color:#1e1b4b;font-size:32px;display:flex;align-items:center;justify-content:center}
.hit{position:absolute;top:20px;right:20px;background:#facc15;color:#1e1b4b;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
</style></head><body>
<nav><div class="logo">🍋 ЛАЙМ</div><div class="cart">🛒 Корзина 2</div></nav>
<div class="hero"><div><h1>Вкусно. Полезно.<br>Уже у двери.</h1><p>Рационы на 1, 5 или 7 дней — от 1 290 ₽ в день</p><span class="cta">Подобрать рацион →</span></div><div class="big">🥗</div></div>
<div class="tabs"><span class="tab on">Все</span><span class="tab">Похудение</span><span class="tab">Баланс</span><span class="tab">Спорт</span></div>
<div class="scroll">
<div class="card" style="background:#22c55e"><span class="hit">ХИТ</span><div class="e">🥗</div><h3>Баланс</h3><p>1800 ккал</p><div class="p">1 490 ₽</div><div class="add">+</div></div>
<div class="card" style="background:#3b82f6"><div class="e">🥑</div><h3>Фит</h3><p>1400 ккал</p><div class="p">1 290 ₽</div><div class="add">+</div></div>
<div class="card" style="background:#f97316"><div class="e">🍗</div><h3>Спорт</h3><p>2600 ккал</p><div class="p">1 890 ₽</div><div class="add">+</div></div>
</div></body></html>
